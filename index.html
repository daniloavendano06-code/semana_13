<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autodrive - Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<header>
    <h1>Autodrive</h1>
    <p>Panel de Gestión e Inventario de Vehículos</p>
</header>

<main>
    <section class="panel">
        <div class="form-section">
            <h2>Registrar Vehículo</h2>

            <form id="formVehiculo">
                <select id="tipoVehiculo">
                    <option value="">Seleccione tipo de vehículo</option>
                    <option value="Sedán">Sedán</option>
                    <option value="SUV">SUV</option>
                    <option value="Pickup">Pickup</option>
                    <option value="Hatchback">Hatchback</option>
                    <option value="Camioneta">Camioneta</option>
                    <option value="Deportivo">Deportivo</option>
                    <option value="Eléctrico">Eléctrico</option>
                    <option value="Híbrido">Híbrido</option>
                    <option value="Minivan">Minivan</option>
                </select>

                <select id="modeloVehiculo">
                    <option value="">Seleccione modelo</option>
                </select>

                <input type="number" id="precio" placeholder="Precio base del vehículo">

                <button type="submit">Agregar Vehículo</button>
            </form>
        </div>

        <div class="metricas">
            <div class="metrica-card">
                <h3>Total de Autos</h3>
                <p id="totalAutos">0</p>
            </div>

            <div class="metrica-card">
                <h3>Valor de Inversión</h3>
                <p id="totalInversion">$0.00</p>
            </div>
        </div>
    </section>

    <section class="inventario">
        <h2>Inventario Actual</h2>
        <div id="listaVehiculos"></div>
    </section>
</main>
<footer>
    <div class="footer-content">
        <h3>Autodrive</h3>
        <p>Panel de Gestión e Inventario de Vehículos</p>

        <p class="copyright">
            © 2026 Autodrive. Todos los derechos reservados.
        </p>

        <p class="autor">
            Desarrollado por Danilo Alessandro Avendaño Chávez
        </p>
    </div>
</footer>
<script type="module" src="main.js"></script>
</body>
</html>
